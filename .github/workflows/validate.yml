name: Validate bootstrap materials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/vendor_materials.py verify
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/github-dns-bypass/tests -v
