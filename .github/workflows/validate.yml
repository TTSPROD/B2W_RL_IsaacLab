name: Validate B2W runtime and retained evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/validation.txt
      - run: python scripts/vendor_materials.py verify
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_project.py
      - run: python -m unittest discover -s skills/github-dns-bypass/tests -v
